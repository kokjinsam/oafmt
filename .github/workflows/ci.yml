name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read repository tool versions
        id: versions
        run: scripts/tools ci-versions >> "$GITHUB_OUTPUT"

      - name: Set up Just
        uses: kokjinsam/setup-just@v1.0.0
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.versions.outputs.current_rust }}
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Set up check tools
        run: just setup check

      - name: Check workspace
        run: just check

      - name: Audit dependencies
        run: just audit

      - name: Check release configuration
        run: just release-check

  minimum:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read repository tool versions
        id: versions
        run: scripts/tools ci-versions >> "$GITHUB_OUTPUT"

      - name: Read workspace MSRV
        id: msrv
        uses: actions-rust-lang/msrv@v0.1.1

      - name: Set up Just
        uses: kokjinsam/setup-just@v1.0.0
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
          cache: false
          rustflags: ""

      - name: Check workspace at MSRV
        run: just msrv

  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - format_yaml
          - format_json
          - classify_oas
          - reorder_edits
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read repository tool versions
        id: versions
        run: scripts/tools ci-versions >> "$GITHUB_OUTPUT"

      - name: Set up Just
        uses: kokjinsam/setup-just@v1.0.0
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.versions.outputs.nightly_rust }}
          cache: false
          rustflags: ""

      - name: Set up fuzz tools
        run: just setup fuzz

      - name: Run bounded fuzz smoke campaign
        run: just fuzz-smoke "${{ matrix.target }}"

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
