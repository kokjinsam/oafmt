name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - format_yaml
          - format_json
          - classify_oas
          - reorder_edits
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read repository tool versions
        id: versions
        run: scripts/tools ci-versions >> "$GITHUB_OUTPUT"

      - name: Set up Just
        uses: kokjinsam/setup-just@v1.0.0
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.versions.outputs.nightly_rust }}
          cache: false
          rustflags: ""

      - name: Set up fuzz tools
        run: just setup fuzz

      - name: Run fuzz campaign
        run: just fuzz "${{ matrix.target }}"

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
