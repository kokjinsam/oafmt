[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Only plan releases on pull requests
pr-run-mode = "plan"
# Only the public CLI package gets binary release artifacts
packages = ["oafmt"]
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Publish the generated formula to the project tap
tap = "kokjinsam/homebrew-tap"
publish-jobs = ["homebrew"]
publish-prereleases = false
# Generate one SHA-256 file per archive
checksum = "sha256"
# GitHub already provides source snapshots for tags
source-tarball = false
# Where to host releases
hosting = "github"
